<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WI Hero — Normal mode (desktop demo)</title>
<style>
  :root{
    --fg:#e4e2da; --tint:#1d1e22; --accent:#e3913a;
    --surface:#2a2b30; --raised:#34353b; --line:#3a3d44; --line2:#2a2c31; --muted:#9a9b94;
    --ground:#121315; --hover:#2a2c31; --bad:#ff6f61;
    --s-key:#6fd09a; --s-perm:#6fa8ff;
    --p-open:#45c9bd;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--ground);font-family:-apple-system,'Segoe UI',Inter,'Noto Sans',sans-serif;color:var(--fg)}
  button{font:inherit;color:inherit;background:none;border:none;margin:0;padding:0;cursor:pointer;text-align:inherit}
  input,textarea{font:inherit;color:inherit}
  ::placeholder{color:var(--muted)}
  svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}

  .backdrop{position:fixed;inset:0;padding:28px 48px;display:flex;flex-direction:column;gap:14px;filter:blur(1px);opacity:.55}
  .backdrop .bar{height:40px;display:flex;align-items:center;gap:16px;color:var(--muted);font-size:13px;border-bottom:1px solid var(--line2);padding-bottom:12px}
  .backdrop .bar b{color:var(--fg)}
  .bubble{max-width:620px;background:var(--surface);border-radius:10px;padding:12px 16px;font-size:14px;line-height:1.5;color:var(--muted)}
  .bubble.them{align-self:flex-start}
  .bubble.me{align-self:flex-end}
  .scrim{position:fixed;inset:0;background:rgba(8,8,10,.58)}

  .panel{position:relative;width:1120px;height:760px;margin:70px auto 0;background:var(--tint);border:1px solid var(--line);border-radius:12px;box-shadow:0 30px 70px rgba(0,0,0,.5);display:flex;flex-direction:column;overflow:hidden}

  #tabstrip{flex-shrink:0;min-height:50px;display:flex;align-items:stretch;border-bottom:1px solid var(--line);overflow-x:auto}
  .iconbtn{width:46px;flex-shrink:0;display:flex;align-items:center;justify-content:center;color:var(--muted)}
  .iconbtn:hover{color:var(--fg)}
  .tab{flex-shrink:0;display:flex;align-items:center;gap:7px;padding:0 14px;font-size:14px;color:var(--muted);border-bottom:3px solid transparent;max-width:180px}
  .tab.home{width:50px;padding:0;justify-content:center}
  .tab.active{color:var(--fg);border-bottom-color:var(--accent)}
  .tab .dot{width:7px;height:7px;border-radius:4px;background:var(--s-key);flex-shrink:0}
  .tab .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tab .x{width:18px;height:18px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:var(--muted);flex-shrink:0}
  .tab .x:hover{background:var(--hover);color:var(--fg)}
  .spacer{flex:1}

  .view{flex:1;min-height:0;display:flex}

  #view-home{flex-direction:column;overflow-y:auto;padding:24px 36px 32px}
  .home-head{display:flex;align-items:center;gap:16px;margin-bottom:10px}
  .home-head h1{margin:0;font-size:24px;font-weight:700;flex-shrink:0}
  .toolbar{display:flex;align-items:center;gap:10px;margin-bottom:22px}
  .search{height:34px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:0 12px;font-size:13px;width:320px}
  .tbtn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px;border-radius:8px;font-size:13px;flex-shrink:0}
  .tbtn.primary{background:var(--accent);color:#16171a;font-weight:600}
  .tbtn.ghost{border:1px solid var(--line);color:var(--fg)}
  .label{color:var(--muted);font-size:11px;font-weight:600;letter-spacing:.04em;margin-bottom:12px}

  .selhead{display:flex;align-items:center;gap:10px;margin-bottom:14px}
  .selhead .cnt{font-size:14px;font-weight:600;margin-right:6px}
  .selhead button{font-size:13px;color:var(--fg);padding:6px 10px;border-radius:7px}
  .selhead button:hover{background:var(--hover)}
  .selhead button.danger{color:var(--bad)}
  .selhead button:disabled{color:var(--muted);cursor:default}
  .selhead button:disabled:hover{background:none}
  .selbar{display:flex;gap:8px;margin-bottom:18px}
  .selbar button{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:7px;border:1px solid var(--line);font-size:12.5px}
  .selbar button:disabled{color:var(--muted);cursor:default}

  .section{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:11px;font-weight:600;letter-spacing:.04em;margin:18px 0 10px}
  .section .toggle-fold{display:flex;align-items:center;gap:6px;color:var(--muted)}
  .section .toggle-fold svg{transition:transform .12s}
  .section.open .toggle-fold svg{transform:rotate(90deg)}
  .section .selall{width:16px;height:16px;border-radius:4px;border:1.5px solid var(--muted);flex-shrink:0}
  .section .selall.on{background:var(--accent);border-color:var(--accent);display:flex;align-items:center;justify-content:center;color:#16171a}

  .grid{display:grid;grid-template-columns:repeat(4, 1fr);gap:14px;margin-bottom:6px}
  .card{position:relative;text-align:left;padding:16px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:8px;min-height:128px}
  .card .cardtop{display:flex;align-items:flex-start;gap:8px}
  .card .check{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--muted);flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center}
  .card .check.on{background:var(--accent);border-color:var(--accent);color:#16171a}
  .card .more{position:absolute;top:10px;right:10px;width:26px;height:26px;border-radius:6px;color:var(--muted)}
  .card .more:hover{background:var(--hover);color:var(--fg)}
  .card .name{font-size:15px;font-weight:600;padding-right:22px}
  .card .gpick{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:12px;border:1px solid var(--line);font-size:11px;font-weight:600;color:var(--muted);align-self:flex-start}
  .card .gpick .gdot{width:7px;height:7px;border-radius:4px;border:1.5px solid var(--muted);flex-shrink:0}
  .card .gpick.on{border-color:var(--p-open);color:var(--p-open)}
  .card .gpick.on .gdot{background:var(--p-open);border-color:var(--p-open)}
  .card .links{display:flex;flex-wrap:wrap;gap:6px}
  .chip{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 9px;border-radius:11px;border:1px solid var(--line);color:var(--muted);font-size:11px;font-weight:600;max-width:100%;overflow:hidden}
  .chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .card .spacer{flex:1}
  .card .count{font-size:12px;color:var(--muted)}

  .menu{position:fixed;min-width:190px;background:var(--raised);border:1px solid var(--line);border-radius:9px;box-shadow:0 14px 34px rgba(0,0,0,.5);padding:6px;z-index:50}
  .menu button{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:6px;font-size:13px}
  .menu button:hover{background:var(--hover)}
  .menu button.danger{color:var(--bad)}
  .menu hr{border:none;border-top:1px solid var(--line2);margin:4px 2px}

  #view-book{min-height:0}
  .sidebar{width:300px;flex-shrink:0;border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
  .sidebar .bookname{display:flex;align-items:center;gap:8px;padding:14px 14px 4px;color:var(--muted);font-size:11px;font-weight:600;letter-spacing:.04em}
  .sidebar .bookname b{color:var(--fg);font-weight:700;letter-spacing:0;font-size:13px}
  .search-row{padding:10px 14px}
  .search-row label{display:block;font-size:11px;color:var(--muted);margin-bottom:6px}
  .search-row input{width:100%;height:32px;border-radius:7px;border:1px solid var(--line);background:var(--surface);color:var(--fg);padding:0 10px;font-size:13px}
  .entries{flex:1;overflow-y:auto;padding-bottom:12px}
  .group{padding:12px 14px 6px;color:var(--muted);font-size:11px;font-weight:600;letter-spacing:.04em}
  .entry-row{width:100%;display:flex;align-items:center;gap:10px;min-height:40px;padding:4px 14px}
  .entry-row .dot{width:6px;height:6px;border-radius:3px;flex-shrink:0}
  .entry-row .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13.5px}
  .entry-row.active{background:var(--hover);border-left:2px solid var(--accent)}
  .entry-row.active .nm{font-weight:600}

  .editor{flex:1;min-width:0;overflow-y:auto;padding:26px 40px}
  .ename{width:100%;max-width:560px;border:none;background:none;color:var(--fg);padding:0;font-size:26px;font-weight:700;margin-bottom:10px;display:block}
  .meta-row{display:flex;align-items:center;gap:10px;margin-bottom:20px;flex-wrap:wrap}
  .bookref{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:13px}
  .storychip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;border-radius:14px;border:1px solid color-mix(in srgb, var(--p-open) 55%, var(--line));background:color-mix(in srgb, var(--p-open) 12%, transparent);color:var(--fg);font-size:12.5px}
  .row{display:flex;align-items:center;gap:8px;padding:14px 0;border-top:1px solid var(--line2)}
  .row .lbl{color:var(--muted);font-size:14px}
  .row .val{display:inline-flex;align-items:center;gap:5px;font-weight:700;font-size:14px}
  .toggle{width:46px;height:26px;border-radius:13px;position:relative;flex-shrink:0}
  .toggle.on{background:var(--accent)}
  .toggle.off{background:var(--line)}
  .toggle .knob{position:absolute;top:2px;width:22px;height:22px;border-radius:11px;background:#fff;transition:left .12s}
  .toggle.on .knob{left:22px}
  .toggle.off .knob{left:2px}
  .kwrow{display:flex;align-items:center;gap:10px;padding:14px 0;border-top:1px solid var(--line2);flex-wrap:wrap}
  .kwrow input{flex:1;min-width:200px;border:none;background:none;color:var(--fg);font-size:14px;padding:0}
  .params{display:flex;align-items:center;gap:8px;width:100%;padding:14px 0;border-top:1px solid var(--line2)}
  .params .t{font-weight:700;font-size:15px}
  .params .v{color:var(--muted);font-size:13px}
  .content-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px;padding-top:20px;border-top:1px solid var(--line2)}
  .content-head .t{font-weight:700;font-size:15px}
  .content-head .v{color:var(--muted);font-size:12.5px}
  .econtent{width:100%;border:none;background:none;color:var(--fg);padding:0;font-size:14.5px;line-height:1.7;resize:vertical}
  .empty{padding:40px;color:var(--muted);font-size:14px}

  #toast{position:absolute;left:50%;bottom:22px;transform:translateX(-50%) translateY(12px);background:var(--raised);border:1px solid var(--line);border-radius:9px;padding:9px 16px;font-size:13px;box-shadow:0 10px 24px rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .15s, transform .15s;z-index:60}
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<div class="backdrop">
  <div class="bar"><b>SillyTavern</b><span>Chat</span><span>Characters</span><span>World Info</span><span>Extensions</span></div>
  <div class="bubble them">The chapel bell has not rung since the king's coronation&hellip;</div>
  <div class="bubble me">I want to ring it myself.</div>
</div>
<div class="scrim"></div>

<div class="panel" id="panel">
  <div id="tabstrip"></div>
  <div class="view" id="mainview"></div>
  <div id="toast"></div>
</div>

<script>
const ENTRY_SETS = {
  'Acher_legacy': [
    { uid:'kestrel', name:'Kestrel Vane', group:'Characters', strategy:'key', kw:'kestrel, swordmaster, exile', body:'Once the king\u2019s sworn blade, now sworn to nothing. Keeps a room in the chapel loft and tells no one why.', tok:'142 tokens', on:true },
    { uid:'hollow',  name:'The Hollow King', group:'Characters', strategy:'perm', kw:'hollow king, the throne, usurper', body:'Once second to the rightful line, now crowned by a bell no one rang. The court still bows; the chapel still waits.', tok:'186 tokens', on:true, pieces:3 },
    { uid:'chapel',  name:'Chapel of Ash', group:'Locations', strategy:'key', kw:'chapel of ash, the bell, sanctuary', body:'Grey stone against a greyer sky. The bell tower has stood empty since the coronation.', tok:'98 tokens', on:true },
    { uid:'sable',   name:'Sable Market', group:'Locations', strategy:'key', kw:'sable market, the docks, smugglers', body:'Where the city buys what it won\u2019t ask about. Busiest an hour before curfew.', tok:'77 tokens', on:false },
    { uid:'bell',    name:'The Bell Law', group:'Lore', strategy:'key', kw:'the bell law, the coronation bell, royal custom', body:'By custom, no reign is legitimate until the bell rings. No one has rung it in a generation.', tok:'64 tokens', on:true },
  ],
};
function genericEntries(book, n){
  const out = [];
  for (let i = 1; i <= n; i++) out.push({ uid:`${book}-e${i}`, name:`Entry ${i}`, group:'', strategy:'key', kw:'no key words', body:'', tok:'0 tokens', on:true });
  return out;
}

const BOOKS = {
  'A long way home':          { count:4,  global:false, links:[], folder:null },
  'Acher_legacy':              { count:31, global:false, links:[], folder:'Acher' },
  'Acher_V2':                  { count:14, global:false, links:[{name:'The Blooming Lake mansion'}], folder:'Acher' },
  'Amalia-Taylor World Lore':  { count:6,  global:false, links:[{name:'Princess Amalia Arcanisse'}], folder:null },
  'Cox and Bals Thanksgiving': { count:5,  global:false, links:[{name:'Anita'},{name:'Marcus'}], folder:null },
  'CyberpunkH':                { count:9,  global:false, links:[{name:'Cyberpunk horror'}], folder:null },
  'EnUWF':                     { count:8,  global:true,  links:[{name:'Riley'}], folder:null },
  'For Ethan':                 { count:1,  global:false, links:[], folder:null },
};
function entriesOf(book){ return ENTRY_SETS[book] || (ENTRY_SETS[book] = genericEntries(book, Math.min(BOOKS[book]?.count ?? 1, 6))); }
function linkText(book){ const l = BOOKS[book]?.links || []; return l.length ? `${l[0].name}${l.length > 1 ? ' +' + (l.length - 1) : ''}` : ''; }

let tabUid = 1;
const homeTab = { id: 0, home: true, page: { type:'home' } };
let tabs = [homeTab];
let activeId = 0;
let selectMode = null;
let collapsedFolders = new Set();
let openMenu = null;

function activeTab(){ return tabs.find(t => t.id === activeId); }
function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove('show'), 2200);
}
function closeMenu(){ if (openMenu) { openMenu.remove(); openMenu = null; document.removeEventListener('click', closeMenu, true); } }

function goHome(){ selectMode = null; activeId = homeTab.id; render(); }
function newTab(){ const t = { id: ++tabUid, fresh: true, page: { type:'home' } }; tabs.push(t); activeId = t.id; selectMode = null; render(); }
function closeTab(id){
  const i = tabs.findIndex(t => t.id === id);
  if (i < 0 || tabs[i].home) return;
  tabs.splice(i, 1);
  if (activeId === id) activeId = (tabs[i] || tabs[i - 1] || tabs[0]).id;
  render();
}
function openBook(book, { background = false } = {}){
  const cur = activeTab();
  if (background || cur.home){
    const t = { id: ++tabUid, page: { type:'book', book, entry: entriesOf(book)[0]?.uid || null } };
    tabs.splice(tabs.indexOf(cur) + 1, 0, t);
    if (background){ toast('Opened in a background tab'); render(); return; }
    activeId = t.id;
  } else {
    cur.page = { type:'book', book, entry: entriesOf(book)[0]?.uid || null };
    delete cur.fresh;
  }
  selectMode = null;
  render();
}

function toggleSelect(name){ selectMode.has(name) ? selectMode.delete(name) : selectMode.add(name); render(); }
function visibleBookNames(){ return Object.keys(BOOKS); }

function newBook(){
  const n = prompt('Book name');
  if (!n) return;
  BOOKS[n] = { count: 0, global: false, links: [], folder: null };
  openBook(n);
}
function newFolder(){
  const f = prompt('Folder name (Places/Town for one inside another)');
  if (!f) return;
  toast(`Folder "${f}" created \u2014 move a book into it from its \u22ee menu`);
}
function renameBook(book){
  const n = prompt('Book name', book);
  if (!n || n === book) return;
  BOOKS[n] = BOOKS[book]; delete BOOKS[book];
  if (ENTRY_SETS[book]) { ENTRY_SETS[n] = ENTRY_SETS[book]; delete ENTRY_SETS[book]; }
  for (const t of tabs) if (t.page?.book === book) t.page.book = n;
  toast(`Renamed to ${n}`);
  render();
}
function moveBookToFolder(book){
  const f = prompt('Move to folder (blank = no folder)', BOOKS[book].folder || '');
  BOOKS[book].folder = f ? f.trim() : null;
  render();
}
function deleteBooks(names){
  if (!names.length) return;
  if (!confirm(`Delete ${names.length === 1 ? names[0] : names.length + ' books'}? This can't be undone in the demo.`)) return;
  for (const n of names) delete BOOKS[n];
  tabs = tabs.filter(t => t.home || !names.includes(t.page?.book));
  if (!tabs.find(t => t.id === activeId)) activeId = homeTab.id;
  selectMode = null;
  render();
}

function render(){ renderTabs(); renderMain(); }

function renderTabs(){
  const strip = document.getElementById('tabstrip');
  strip.innerHTML = '';
  for (const t of tabs){
    const active = t.id === activeId;
    const b = document.createElement('button');
    b.className = `tab${active ? ' active' : ''}${t.home ? ' home' : ''}`;
    if (t.home){
      b.setAttribute('aria-label', 'Home');
      b.innerHTML = '<svg class="i" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>';
      b.onclick = goHome;
    } else {
      const label = t.page.type === 'home' ? 'Home' : t.page.book;
      const nm = document.createElement('span'); nm.className = 'nm'; nm.textContent = label;
      if (t.page.type === 'book') { const dot = document.createElement('span'); dot.className = 'dot'; b.append(dot); }
      b.append(nm);
      b.onclick = () => { if (activeId !== t.id) { activeId = t.id; selectMode = null; render(); } };
      if (active){
        const x = document.createElement('span');
        x.className = 'x'; x.setAttribute('aria-label', 'Close tab');
        x.innerHTML = '<svg class="i" viewBox="0 0 24 24" width="12" height="12" stroke-width="2.4"><path d="M6 6l12 12M18 6L6 18"/></svg>';
        x.onclick = (e) => { e.stopPropagation(); closeTab(t.id); };
        b.append(x);
      }
    }
    strip.append(b);
  }
  const plus = document.createElement('button');
  plus.className = 'iconbtn'; plus.style.width = '38px'; plus.setAttribute('aria-label', 'New tab');
  plus.innerHTML = '<svg class="i" viewBox="0 0 24 24" width="15" height="15"><path d="M12 5v14M5 12h14"/></svg>';
  plus.onclick = newTab;
  strip.append(plus);
  const spacer = document.createElement('div'); spacer.className = 'spacer';
  strip.append(spacer);
  const close = document.createElement('button');
  close.className = 'iconbtn'; close.setAttribute('aria-label', 'Close WI Hero');
  close.innerHTML = '<svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>';
  strip.append(close);
}

function renderMain(){
  const v = document.getElementById('mainview');
  v.innerHTML = '';
  const p = activeTab().page;
  if (p.type === 'home') v.append(renderHome());
  else v.append(renderBookView(p));
}

function renderHome(){
  const root = document.createElement('div');
  root.id = 'view-home';

  if (selectMode){
    const names = visibleBookNames();
    const h = document.createElement('div'); h.className = 'selhead';
    const x = mkbtn('', '<svg class="i" viewBox="0 0 24 24" width="15" height="15" stroke-width="2.4"><path d="M6 6l12 12M18 6L6 18"/></svg>', () => { selectMode = null; render(); });
    const cnt = document.createElement('span'); cnt.className = 'cnt'; cnt.textContent = `${selectMode.size} selected`;
    const everything = names.length && names.every(n => selectMode.has(n));
    const allNone = mkbtn('', everything ? 'None' : 'All', () => { selectMode = everything ? new Set() : new Set(names); render(); });
    const invert = mkbtn('', 'Invert', () => { selectMode = new Set(names.filter(n => !selectMode.has(n))); render(); });
    const del = mkbtn('danger', 'Delete', () => deleteBooks([...selectMode]));
    del.disabled = !selectMode.size;
    h.append(x, cnt, allNone, invert, del);
    root.append(h);

    const bar = document.createElement('div'); bar.className = 'selbar';
    const move = mkbtn('', '<svg class="i" viewBox="0 0 24 24" width="13" height="13"><path d="M5 9l4-4 4 4M9 5v14M19 15l-4 4-4-4"/></svg><span>Move</span>', () => {
      const f = prompt('Move selected to folder (blank = no folder)');
      for (const n of selectMode) BOOKS[n].folder = f ? f.trim() : null;
      selectMode = null; render();
    });
    move.disabled = !selectMode.size;
    const exp = mkbtn('', '<svg class="i" viewBox="0 0 24 24" width="13" height="13"><path d="M16 18l6-6-6-6M8 6l-6 6 6 6"/></svg><span>Export</span>', () => { toast(`Exported ${selectMode.size} book(s)`); });
    exp.disabled = !selectMode.size;
    bar.append(move, exp);
    root.append(bar);
  } else {
    const h = document.createElement('div'); h.className = 'home-head';
    h.innerHTML = '<h1>World Info</h1>';
    const gear = document.createElement('button'); gear.className = 'iconbtn'; gear.style.cssText = 'width:34px;height:34px;flex-shrink:0;margin-left:auto';
    gear.setAttribute('aria-label', 'World Info settings');
    gear.innerHTML = '<svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg>';
    h.append(gear);
    root.append(h);

    const tb = document.createElement('div'); tb.className = 'toolbar'; tb.style.justifyContent = 'center';
    const search = document.createElement('input'); search.className = 'search'; search.type = 'text'; search.placeholder = 'Search books\u2026';
    const left = document.createElement('div'); left.style.cssText = 'display:flex;gap:10px';
    const nb = mkbtn('tbtn primary', '<svg class="i" viewBox="0 0 24 24" width="14" height="14" stroke-width="2.4"><path d="M12 5v14M5 12h14"/></svg><span>New book</span>', newBook);
    const nf = mkbtn('tbtn ghost', '<svg class="i" viewBox="0 0 24 24" width="14" height="14"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20M4 19.5v-13A2.5 2.5 0 0 1 6.5 4H10l2 2h7.5"/><path d="M12 12v4M10 14h4"/></svg><span>New folder</span>', newFolder);
    left.append(nb, nf);
    const sel = mkbtn('tbtn ghost', '<svg class="i" viewBox="0 0 24 24" width="14" height="14"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M8 12l3 3 5-6"/></svg><span>Select</span>', () => { selectMode = new Set(); render(); });
    tb.append(left, search, sel);
    root.append(tb);
  }

  const names = visibleBookNames();
  const loose = names.filter(n => !BOOKS[n].folder);
  const folders = [...new Set(names.map(n => BOOKS[n].folder).filter(Boolean))].sort();

  root.append(sectionLabel('Books'));
  root.append(cardGrid(loose));
  for (const f of folders){
    const list = names.filter(n => BOOKS[n].folder === f);
    const key = `home:${f}`;
    const open = !collapsedFolders.has(key);
    root.append(folderHead(f, list, open, () => { open ? collapsedFolders.add(key) : collapsedFolders.delete(key); render(); }));
    if (open) root.append(cardGrid(list));
  }
  if (!names.length) { const e = document.createElement('div'); e.className = 'empty'; e.textContent = 'No books yet. Click New book to make the first one.'; root.append(e); }
  return root;
}

function sectionLabel(text){ const d = document.createElement('div'); d.className = 'label'; d.textContent = text; return d; }

function folderHead(name, list, open, onToggle){
  const s = document.createElement('div'); s.className = `section${open ? ' open' : ''}`;
  if (selectMode){
    const all = list.length && list.every(n => selectMode.has(n));
    const c = document.createElement('span'); c.className = `selall${all ? ' on' : ''}`;
    if (all) c.innerHTML = '<svg class="i" viewBox="0 0 24 24" width="10" height="10" stroke-width="3"><path d="M20 6L9 17l-5-5"/></svg>';
    c.onclick = () => { for (const n of list) all ? selectMode.delete(n) : selectMode.add(n); render(); };
    s.append(c);
  }
  const t = mkbtn('toggle-fold', `<svg class="i" viewBox="0 0 24 24" width="13" height="13" stroke-width="2.4"><path d="M9 6l6 6-6 6"/></svg><span>${name} \u00b7 ${list.length}</span>`, onToggle);
  s.append(t);
  return s;
}

function cardGrid(names){
  const g = document.createElement('div'); g.className = 'grid';
  for (const n of names) g.append(bookCard(n));
  return g;
}

function bookCard(name){
  const b = BOOKS[name];
  const card = document.createElement('button'); card.className = 'card';
  card.oncontextmenu = (e) => { e.preventDefault(); openBook(name, { background: true }); };
  card.onclick = () => { selectMode ? toggleSelect(name) : openBook(name); };

  const top = document.createElement('div'); top.className = 'cardtop';
  if (selectMode){
    const c = document.createElement('span'); c.className = `check${selectMode.has(name) ? ' on' : ''}`;
    if (selectMode.has(name)) c.innerHTML = '<svg class="i" viewBox="0 0 24 24" width="11" height="11" stroke-width="3"><path d="M20 6L9 17l-5-5"/></svg>';
    top.append(c);
  } else {
    top.innerHTML = '<svg class="i" viewBox="0 0 24 24" width="20" height="20" stroke="var(--muted)" stroke-width="1.8"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2Z"/></svg>';
  }
  const nm = document.createElement('div'); nm.className = 'name'; nm.textContent = name;
  const wrap = document.createElement('div'); wrap.style.cssText = 'display:flex;flex-direction:column;gap:6px;flex:1;min-width:0';
  wrap.append(nm);
  top.append(wrap);
  card.append(top);

  if (!selectMode){
    const more = document.createElement('button'); more.className = 'more'; more.setAttribute('aria-label', `${name} actions`);
    more.innerHTML = '<svg class="i" viewBox="0 0 24 24" width="15" height="15"><circle cx="12" cy="6" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="12" cy="18" r="1.4"/></svg>';
    more.onclick = (e) => { e.stopPropagation(); showBookMenu(name, more); };
    card.append(more);
  }

  const gp = document.createElement('button'); gp.className = `gpick${b.global ? ' on' : ''}`;
  gp.innerHTML = `<span class="gdot"></span><span>${b.global ? 'Global' : 'Not global'}</span>`;
  gp.onclick = (e) => { e.stopPropagation(); if (selectMode) return; b.global = !b.global; toast(b.global ? `${name} is active everywhere` : `${name} is no longer global`); render(); };
  card.append(gp);

  const lt = linkText(name);
  if (lt){
    const row = document.createElement('div'); row.className = 'links';
    const chip = document.createElement('span'); chip.className = 'chip';
    chip.innerHTML = `<svg class="i" viewBox="0 0 24 24" width="11" height="11" stroke-width="2.3"><path d="M10 13a5 5 0 0 0 7.5.5l2-2a5 5 0 0 0-7-7l-1 1"/><path d="M14 11a5 5 0 0 0-7.5-.5l-2 2a5 5 0 0 0 7 7l1-1"/></svg><span>${lt}</span>`;
    row.append(chip);
    card.append(row);
  }

  const sp = document.createElement('div'); sp.className = 'spacer';
  card.append(sp);
  const count = document.createElement('div'); count.className = 'count'; count.textContent = `${b.count} ${b.count === 1 ? 'entry' : 'entries'}`;
  card.append(count);

  return card;
}

function showBookMenu(name, anchor){
  closeMenu();
  const rect = anchor.getBoundingClientRect();
  const m = document.createElement('div'); m.className = 'menu';
  m.style.top = `${rect.bottom + 4}px`;
  m.style.left = `${Math.min(rect.left, window.innerWidth - 210)}px`;
  const item = (icon, label, fn, danger) => {
    const btn = document.createElement('button'); if (danger) btn.className = 'danger';
    btn.innerHTML = `${icon}<span>${label}</span>`;
    btn.onclick = () => { closeMenu(); fn(); };
    m.append(btn);
  };
  item('<svg class="i" viewBox="0 0 24 24" width="14" height="14"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18"/></svg>', 'Open in new tab', () => openBook(name, { background: true }));
  item('<svg class="i" viewBox="0 0 24 24" width="14" height="14"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>', 'Rename', () => renameBook(name));
  item('<svg class="i" viewBox="0 0 24 24" width="14" height="14"><path d="M5 9l4-4 4 4M9 5v14M19 15l-4 4-4-4"/></svg>', 'Move to folder', () => moveBookToFolder(name));
  item('<svg class="i" viewBox="0 0 24 24" width="14" height="14"><path d="M16 18l6-6-6-6M8 6l-6 6 6 6"/></svg>', 'Export', () => toast(`${name}.json exported`));
  item('<svg class="i" viewBox="0 0 24 24" width="14" height="14"><path d="M12 8v4l3 2"/><circle cx="12" cy="12" r="9"/></svg>', 'Snapshots', () => toast('Snapshots (not wired up in this demo)'));
  m.append(document.createElement('hr'));
  item('<svg class="i" viewBox="0 0 24 24" width="14" height="14"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6"/></svg>', 'Delete', () => deleteBooks([name]), true);
  document.body.append(m);
  openMenu = m;
  setTimeout(() => document.addEventListener('click', closeMenu, true));
}

function mkbtn(cls, html, onclick){ const b = document.createElement('button'); b.className = cls; b.innerHTML = html; b.onclick = onclick; return b; }

function renderBookView(p){
  const root = document.createElement('div'); root.id = 'view-book'; root.style.display = 'flex'; root.style.flex = '1'; root.style.minHeight = '0';
  const entries = entriesOf(p.book);
  const sidebar = document.createElement('div'); sidebar.className = 'sidebar';
  const bn = document.createElement('div'); bn.className = 'bookname';
  bn.innerHTML = `<svg class="i" viewBox="0 0 24 24" width="13" height="13"><path d="M4 19V6a2 2 0 0 1 2-2h12v15H6a2 2 0 0 0-2 2Zm0 0a2 2 0 0 0 2 2h14"/></svg><b>${p.book}</b>`;
  sidebar.append(bn);
  const sr = document.createElement('div'); sr.className = 'search-row';
  sr.innerHTML = `<label for="esearch">Search entries</label><input id="esearch" type="text" placeholder="Search ${p.book}&hellip;">`;
  sidebar.append(sr);
  const list = document.createElement('div'); list.className = 'entries';
  let lastGroup = null;
  for (const e of entries){
    if (e.group && e.group !== lastGroup){ const g = document.createElement('div'); g.className = 'group'; g.textContent = e.group; list.append(g); lastGroup = e.group; }
    const row = document.createElement('button'); row.className = `entry-row${p.entry === e.uid ? ' active' : ''}`;
    const dotColor = e.strategy === 'perm' ? 'var(--s-perm)' : 'var(--s-key)';
    row.innerHTML = `<span class="dot" style="background:${dotColor}"></span><span class="nm">${e.name}</span>`;
    row.onclick = () => { p.entry = e.uid; render(); };
    list.append(row);
  }
  sidebar.append(list);
  root.append(sidebar);

  const editor = document.createElement('div'); editor.className = 'editor';
  const entry = entries.find(e => e.uid === p.entry);
  if (!entry){
    editor.innerHTML = '<div class="empty">No entry selected.</div>';
  } else {
    const ename = document.createElement('input'); ename.className = 'ename'; ename.value = entry.name;
    ename.oninput = () => { entry.name = ename.value; renderTabs(); };
    editor.append(ename);

    const meta = document.createElement('div'); meta.className = 'meta-row';
    meta.innerHTML = `<span class="bookref"><svg class="i" viewBox="0 0 24 24" width="14" height="14"><path d="M4 19V6a2 2 0 0 1 2-2h12v15H6a2 2 0 0 0-2 2Zm0 0a2 2 0 0 0 2 2h14"/></svg>${p.book}</span>`;
    if (entry.pieces) {
      const sc = document.createElement('button'); sc.className = 'storychip';
      sc.innerHTML = `<svg class="i" viewBox="0 0 24 24" width="13" height="13"><path d="M8 7h8M8 12h5M6 17h12"/></svg>Story logic \u2014 ${entry.pieces} pieces`;
      meta.append(sc);
    }
    editor.append(meta);

    const row = document.createElement('div'); row.className = 'row';
    const sd = document.createElement('span'); sd.style.cssText = `width:8px;height:8px;border-radius:4px;background:${entry.strategy === 'perm' ? 'var(--s-perm)' : 'var(--s-key)'}`;
    const lbl = document.createElement('span'); lbl.className = 'lbl'; lbl.textContent = 'Strategy:';
    const val = document.createElement('button'); val.className = 'val'; val.innerHTML = `${entry.strategy === 'perm' ? 'Permanent' : 'Key words'}<svg class="i" viewBox="0 0 24 24" width="12" height="12" stroke-width="2.3"><path d="M6 9l6 6 6-6"/></svg>`;
    const sp2 = document.createElement('div'); sp2.className = 'spacer';
    const tg = document.createElement('button'); tg.className = `toggle ${entry.on ? 'on' : 'off'}`; tg.innerHTML = '<span class="knob"></span>';
    tg.onclick = () => { entry.on = !entry.on; render(); };
    row.append(sd, lbl, val, sp2, tg);
    editor.append(row);

    const kw = document.createElement('label'); kw.className = 'kwrow'; kw.innerHTML = '<span class="lbl">Keywords:</span>';
    const kwi = document.createElement('input'); kwi.value = entry.kw; kwi.oninput = () => entry.kw = kwi.value;
    kw.append(kwi);
    editor.append(kw);

    const par = document.createElement('button'); par.className = 'params';
    par.innerHTML = '<svg class="i" viewBox="0 0 24 24" width="13" height="13" stroke-width="2.3"><path d="M9 6l6 6-6 6"/></svg><span class="t">Parameters</span><span class="v">Defaults</span>';
    editor.append(par);

    const ch = document.createElement('div'); ch.className = 'content-head';
    ch.innerHTML = `<span class="t">Content</span><span class="v">${entry.tok}</span>`;
    editor.append(ch);
    const ta = document.createElement('textarea'); ta.className = 'econtent'; ta.rows = 11; ta.value = entry.body;
    ta.oninput = () => entry.body = ta.value;
    editor.append(ta);
  }
  root.append(editor);
  return root;
}

render();
</script>
</body>
</html>
