<!doctype html><meta charset=utf8><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;700&display=swap">
<style>
body{margin:0;background:#121315;color:#e4e2da;font:14px 'Noto Sans';padding:16px;width:740px}
h2{font-size:14px;color:#a3a49d;font-weight:600;margin:14px 0 8px;letter-spacing:.04em;text-transform:uppercase}
.row{display:flex;gap:14px}.col{flex:1;background:#1a1b1f;border-radius:12px;padding:12px}
.col b{display:block;font-size:12px;color:#a3a49d;margin-bottom:8px}
.card{background:#26282d;border:1px solid #3a3d44;border-left:3px solid var(--s);border-radius:10px;padding:7px 10px;margin:0 0 8px;font-weight:600}
.card small{display:block;font-weight:400;color:#a3a49d;font-size:12px}
.card.vec{border-left:3px dashed var(--s)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.pc{height:24px;padding:0 9px;border-radius:12px;display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;background:#202126;border:1.5px solid currentColor}
.pc.frame{border-style:dashed}
</style>
<svg width=0 height=0 style="position:absolute"><filter id=deu><feColorMatrix type=matrix values="0.367322 0.860646 -0.227968 0 0  0.280085 0.672501 0.047413 0 0  -0.011820 0.042940 0.968881 0 0  0 0 0 1 0"/></filter><filter id=pro><feColorMatrix type=matrix values="0.152286 1.052583 -0.204868 0 0  0.114503 0.786281 0.099216 0 0  -0.003882 -0.048116 1.051998 0 0  0 0 0 1 0"/></filter></svg>
<template id=old>
 <div class=card style="--s:#6fd09a">Mill<small>Keywords</small></div>
 <div class=card style="--s:#7fb2ff">Weather lore<small>Permanent</small></div>
 <div class="card" style="--s:#b48cff">Crows<small>Vectorized</small></div>
 <div class=chips><span class=pc style="color:#6fd09a">Gate</span><span class=pc style="color:#5fc9c9">Gates for</span><span class=pc style="color:#ff8a7a">Closes</span><span class=pc style="color:#e3913a">Switch</span></div>
 <div class=chips><span class=pc style="color:#e6c75a">Glue</span><span class=pc style="color:#c3a6ff">Mask</span><span class=pc style="color:#7fb2ff">Pack</span></div>
</template>
<template id=new>
 <div class=card style="--s:#6fd09a">Mill<small>Keywords</small></div>
 <div class=card style="--s:#6fa8ff">Weather lore<small>Permanent</small></div>
 <div class="card vec" style="--s:#b48cff">Crows<small>Vectorized</small></div>
 <div class=chips><span class=pc style="color:#cfccc2">→ Gate</span><span class=pc style="color:#cfccc2">Gates for →</span><span class=pc style="color:#ff6f61">✕ Closes</span><span class=pc style="color:#ff6f61">⑂ Switch</span></div>
 <div class=chips><span class=pc style="color:#f2cf4a">📌︎ Glue</span><span class=pc style="color:#f07cc8">◐ Mask</span><span class="pc frame" style="color:#cfccc2"># Pack</span></div>
</template>
<h2>Now</h2><div class=row id=r1></div>
<h2>Proposed</h2><div class=row id=r2></div>
<script>
for (const [id,t] of [['r1','old'],['r2','new']]) for (const [lbl,f] of [['Normal vision',''],['Deuteranopia (most common)','url(#deu)'],['Protanopia','url(#pro)']]) {
 const c=document.createElement('div');c.className='col';c.innerHTML='<b>'+lbl+'</b><div style="filter:'+f+'">'+document.getElementById(t).innerHTML+'</div>';document.getElementById(id).appendChild(c);}
</script>
