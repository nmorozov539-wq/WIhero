<!doctype html><meta charset=utf8><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;700&display=swap">
<style>body{margin:0;background:#121315;color:#e4e2da;font:14px 'Noto Sans';padding:16px;width:1130px}
.wrap{display:flex;gap:20px;align-items:flex-start}.pane{background:#16171b;border-radius:14px;padding:10px;background-image:radial-gradient(#25272d 1px,transparent 1px);background-size:20px 20px}
h3{margin:2px 4px 8px;font-size:13px;color:#a3a49d;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.leg{width:300px;font-size:13px;line-height:1.5}.leg h4{margin:14px 0 4px;font-size:12px;color:#a3a49d;letter-spacing:.05em;text-transform:uppercase}.leg p{margin:0 0 6px}
</style>
<div class=wrap><div class=pane><h3>Close gates, free ports, mask stack</h3><svg id=s width=780 height=860></svg></div><div class=leg id=leg></div></div>
<script>
const C={open:'#45c9bd',end:'#ff6f61',glue:'#f2cf4a',mask:'#f07cc8',pack:'#cfccc2',card:'#26282d',line:'#3a3d44',fg:'#e4e2da',mut:'#a3a49d',kw:'#6fd09a',bg:'#16171b',gray:'#4a4d55'};
const W=150,H=56,N=9;const L=[],O=[],P=[],T=[];const cards={};
const grip=(x,y,c)=>{let s='';for(let r=0;r<3;r++)for(let k=0;k<2;k++)s+=`<circle cx="${x+k*6}" cy="${y+r*6}" r="2.1" fill="${c}"/>`;return s;};
function card(id,t,k,x,y,o={}){cards[id]={x,y};let s='';
 if(o.layers)for(let i=o.layers;i>0;i--)s+=`<rect x="${x+i*8}" y="${y-i*8}" width="${W}" height="${H}" rx="10" fill="${i==1?'#3a2a36':'#2f252d'}" stroke="${C.mask}" stroke-opacity=".5"/>`;
 s+=`<rect x="${x}" y="${y}" width="${W}" height="${H}" rx="10" fill="${C.card}" stroke="${o.layers?C.mask:C.line}" filter="url(#sh)"/>`+grip(x+11,y+17,C.kw)+
 `<text x="${x+30}" y="${y+24}" fill="${C.fg}" font-weight="600" font-size="14">${t}</text><text x="${x+30}" y="${y+42}" fill="${o.kc||C.mut}" font-size="12" ${o.kc?'font-weight="600"':''}>${k}</text>`;
 if(o.hold)s+=`<rect x="${x-5}" y="${y+12}" width="10" height="${H-24}" rx="5" fill="${C.glue}"/>`;
 O.push(s);}
// port at side + fraction; kind sock|knob ; returns outer point
function port(id,side,f,kind,c){const {x,y}=cards[id];let px,py,ang;
 if(side=='top'){px=x+W*f;py=y;ang=0}else if(side=='bottom'){px=x+W*f;py=y+H;ang=180}else if(side=='left'){px=x;py=y+H*f;ang=270}else{px=x+W;py=y+H*f;ang=90}
 const rot=`transform="rotate(${ang} ${px} ${py})"`;
 if(kind=='sock')P.push(`<path d="M${px-N},${py} A${N} ${N} 0 0 0 ${px+N},${py} Z" fill="${C.bg}" ${rot}/><path d="M${px-N},${py} A${N} ${N} 0 0 0 ${px+N},${py}" fill="none" stroke="${c}" stroke-width="2.5" ${rot}/>`);
 else P.push(`<path d="M${px+N},${py} A${N} ${N} 0 0 0 ${px-N},${py} Z" fill="${c}" ${rot}/>`);
 const d={top:[0,-1],bottom:[0,1],left:[-1,0],right:[1,0]}[side];const off=kind=='sock'?3:N;return [px+d[0]*off,py+d[1]*off,d];}
function link(a,b,c,ex=''){const [x1,y1,d1]=a,[x2,y2,d2]=b;const k=60;L.push(`<path d="M${x1},${y1} C${x1+d1[0]*k},${y1+d1[1]*k} ${x2+d2[0]*k},${y2+d2[1]*k} ${x2},${y2}" stroke="${c}" stroke-width="2.5" fill="none" stroke-linecap="round" ${ex}/>`);}
function junc(x,y,t,c){O.push(`<circle cx="${x}" cy="${y}" r="13" fill="${C.bg}" stroke="${c}" stroke-width="2.5"/><text x="${x}" y="${y+4}" text-anchor="middle" font-size="10" font-weight="700" fill="${c}">${t}</text>`);}
const lockI=(x,y,c)=>`<rect x="${x-5}" y="${y-2}" width="10" height="8" rx="2" fill="${c}"/><path d="M${x-3},${y-2} v-3 a3 3 0 0 1 6 0 v3" stroke="${c}" stroke-width="1.6" fill="none"/>`;
const clockI=(x,y,c)=>`<circle cx="${x}" cy="${y}" r="5.5" stroke="${c}" stroke-width="1.6" fill="none"/><path d="M${x},${y-3} V${y} H${x+3}" stroke="${c}" stroke-width="1.6" fill="none"/>`;
function pill(x,y,txt,c,icon){const w=txt.length*6.6+(icon?30:18);O.push(`<rect x="${x}" y="${y-11}" width="${w}" height="22" rx="11" fill="#202126" stroke="${c}" stroke-width="1.5"/>${icon?icon(x+13,y,c):''}<text x="${x+(icon?24:9)}" y="${y+4}" font-size="11.5" font-weight="600" fill="${c}">${txt}</text>`);return w;}
function arrowAt(x,y,d,c){const [ax,ay]=d.map(v=>-v);const px=-ay,py=ax;O.push(`<path d="M${x-ax*2},${y-ay*2} L${x-ax*13+px*6},${y-ay*13+py*6} L${x-ax*13-px*6},${y-ay*13-py*6} Z" fill="${c}"/>`);}
// ---- Gatehouse: two ports on top (open + close), switch bottom, gates-for knob right
card('gh','Gatehouse','gate, guard',300,90);
const ghO=port('gh','top',.33,'sock',C.open), ghC=port('gh','top',.7,'sock',C.end);
O.push(`<text x="300" y="30" font-size="11" font-weight="600" fill="${C.mut}">from Tunnel</text>`);L.push(`<path d="M${ghO[0]},40 V${ghO[1]}" stroke="${C.open}" stroke-width="2.5"/>`);
L.push(`<path d="M${ghC[0]},${ghC[1]} V48" stroke="${C.end}" stroke-width="2.5"/>`);pill(ghC[0]-10,40,'10 msgs',C.end,clockI);
const gf=port('gh','right',.5,'knob',C.open);L.push(`<path d="M${gf[0]},${gf[1]} H${gf[0]+40}" stroke="${C.open}" stroke-width="2.5"/>`);pill(gf[0]+40,gf[1],'→ #town',C.open);
{const cx=375,y=146;O.push(`<path d="M${cx},${y} v10" stroke="${C.end}" stroke-width="4" stroke-linecap="round"/><circle cx="${cx}" cy="${y+12}" r="5" fill="${C.end}"/>`);
 card('marsh','Marsh path','marsh',150,250);card('ridge','Ridge path','ridge',450,250);
 const m=port('marsh','top',.5,'sock',C.open),r=port('ridge','top',.5,'sock',C.open);link([cx,y+12,[0,1]],m,C.end,'stroke-width="3"');link([cx,y+12,[0,1]],r,C.end,'stroke-width="3"');}
// ---- Tower stack
card('tower','Tower','mask: ruined',300,450,{layers:2,kc:C.mask});
{const ms=port('marsh','bottom',.5,'knob',C.open),rs=port('ridge','bottom',.5,'knob',C.open),ts=port('tower','top',.33,'sock',C.open);
 const jx=ts[0],jy=ts[1]-50;link(ms,[jx-11,jy-6,[-1,-.3]],C.open);link(rs,[jx+11,jy-6,[1,-.3]],C.open);L.push(`<path d="M${jx},${jy+13} V${ts[1]}" stroke="${C.open}" stroke-width="2.5"/>`);junc(jx,jy,'or',C.open);}
// switcher buttons on left side of stack
const bt=[['base',0],['ruined',1],['rebuilt',0]];const bx=300-78;const btn={};
bt.forEach(([n,on],i)=>{const y=432+i*30;btn[n]=[bx,y+11];O.push(`<rect x="${bx}" y="${y}" width="64" height="22" rx="11" fill="${on?'#4a2a40':'#202126'}" stroke="${on?C.mask:C.line}" stroke-width="1.5"/><text x="${bx+32}" y="${y+15}" text-anchor="middle" font-size="11" font-weight="600" fill="${on?C.mask:C.mut}">${n}</text>`);
 if(n!='base')O.push(`<circle cx="${bx}" cy="${y+11}" r="4" fill="${on?C.open:C.gray}"/>`);
 if(on)O.push(`<circle cx="${bx+58}" cy="${y+4}" r="3.5" fill="${C.fg}"/>`);});
L.push(`<path d="M${bx+64},${443} H300" stroke="${C.line}" stroke-width="1"/>`);
// Storm gates "ruined" (full), Smithy gates both masks (split: ruined full, rebuilt gray)
card('storm','Storm','storm',20,330);card('smithy','Smithy','smith',20,580);
{const s=port('storm','bottom',.4,'knob',C.open);link(s,[btn.ruined[0]-4,btn.ruined[1],[-1,0]],C.open);}
{const s=port('smithy','top',.8,'knob',C.open);const jx=bx-50,jy=500;link(s,[jx,jy+6,[0,1]],C.open);
 O.push(`<circle cx="${jx}" cy="${jy}" r="5" fill="${C.open}"/>`);L.push(`<path d="M${jx},${jy} C${jx+20},${jy} ${bx-30},${btn.ruined[1]} ${bx-4},${btn.ruined[1]}" stroke="${C.open}" stroke-width="2.5" fill="none"/><path d="M${jx},${jy} C${jx+20},${jy} ${bx-30},${btn.rebuilt[1]} ${bx-4},${btn.rebuilt[1]}" stroke="${C.gray}" stroke-width="1.5" fill="none"/>`);}
T.push(['Smithy turns on both masks',150,610,C.mut]);
// ---- Storm-2 glue vignette: Hold + close gate (or: lock calm, Closes for from Finale), ride along
card('storm2','Storm','held by glue',300,700,{hold:1,kc:C.glue});
const so=port('storm2','top',.25,'sock',C.open);L.push(`<path d="M${so[0]},${so[1]} V650" stroke="${C.open}" stroke-width="2.5"/>`);O.push(`<text x="${so[0]-30}" y="645" font-size="11" font-weight="600" fill="${C.mut}">from Mill</text>`);
const sc=port('storm2','right',.5,'sock',C.end);
{const jx=sc[0]+50,jy=sc[1];L.push(`<path d="M${sc[0]},${sc[1]} H${jx-13}" stroke="${C.end}" stroke-width="2.5"/>`);junc(jx,jy,'or',C.end);
 L.push(`<path d="M${jx+13},${jy} H${jx+40}" stroke="${C.end}" stroke-width="2.5"/>`);pill(jx+40,jy,'“calm”',C.end,lockI);
 card('finale','Finale','crown',560,790);const fk=port('finale','top',.5,'knob',C.end);link(fk,[jx,jy+13,[0,1]],C.end,'stroke-dasharray="7 6"');arrowAt(jx,jy+14,[0,1],C.end);}
T.push(['Closes for',640,770,C.end]);
card('echo','Thunder echo','rides with Storm',40,790);
{const x=300+20;L.push(`<path d="M${x},756 C${x},800 200,${818} 196,818" stroke="${C.glue}" stroke-width="3" fill="none"/>`);O.push(`<path d="M${200},${811} L${190},${818} L${200},${825} Z" fill="${C.glue}"/>`);}
const defs='<defs><filter id=sh x=-20% y=-20% width=140% height=160%><feDropShadow dx=0 dy=2 stdDeviation=2 flood-opacity=.45/></filter></defs>';
document.getElementById('s').innerHTML=defs+L.join('')+O.join('')+P.join('')+T.map(([t,x,y,c])=>`<text x="${x}" y="${y}" font-size="11" font-weight="600" fill="${c}">${t}</text>`).join('');
document.getElementById('leg').innerHTML=`
<h4>Close gates (red)</h4><p>Same socket shape as a gate, in red: <b>"close me when"</b>. Gatehouse closes after 10 messages; Storm's glue dries out on the word "calm" <i>or</i> when Finale fires.</p>
<p><b>Closes for</b> is the red knob (Finale). Its link carries the arrow into the closed entry's red socket.</p>
<h4>Free ports</h4><p>Ports sit on any free side. Gatehouse has its gate and close gate side by side on the top edge, the switch underneath, and Gates for on the right.</p>
<p>A long link becomes a short <b>stub</b> ("→ #town", "from Tunnel"); tapping it jumps to the other end.</p>
<h4>Mask stack</h4><p>Layers peek out behind Tower. The buttons on its side switch which layer is shown; the filled one ("ruined") is on top, the white dot marks the mask the current chat uses.</p>
<p>Mask gates plug into the <b>buttons</b>, never into hidden cards. Storm turns on "ruined". Smithy turns on both: its link splits, full color to the shown layer, thin gray to the other.</p>
<p>Tower's own gate (Marsh <i>or</i> Ridge) goes into the stack and stays full color whatever layer is shown.</p>
<h4>Glue</h4><p>Hold: yellow bar on Storm, ended by its close gate. Ride along: yellow arrow to Thunder echo.</p>`;
</script>
