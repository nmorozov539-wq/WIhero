# ST drift (review finding 12): once a week, and by hand, compares the SillyTavern code WI Hero copies or depends on
# in ST's latest release and its staging branch with the fingerprints taken on the version WI Hero is tested on
# (tools/st-drift.json). A failure lists what changed; check it by hand, then update WI Hero and the fingerprints.
name: ST drift

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tools/st-drift.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
