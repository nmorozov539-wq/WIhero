# Unit tests on every push and pull request. They need no SillyTavern; the e2e scripts (e2e/) still run by hand
# against a throwaway SillyTavern.
name: Unit tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test
